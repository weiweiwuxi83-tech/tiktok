<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 东南亚榜单监听台（实时版）</title>
<style>
body{margin:0;padding:24px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#fafafa;color:#1a1a1a}
.wrap{max-width:1080px;margin:0 auto}
/* —— Kimi 设计变量兜底（独立打开时无宿主注入，用浅色默认值）—— */
:root{
--kimi-font-sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
--kimi-color-text-primary:#1a1a1a;--kimi-color-text-secondary:#4d4d4d;
--kimi-color-text-tertiary:#8a8a8a;--kimi-color-text-quaternary:#b5b5b5;
--kimi-color-surface:#ffffff;--kimi-color-surface-muted:#f2f2f2;
--kimi-color-border:#e2e2e2;
--kimi-color-danger:#e5484d;--kimi-color-positive:#30a46c;--kimi-color-warning:#f5a524;
--kimi-color-accent:#3b82f6;--kimi-chart-1:#3b82f6;
--t-fast:120ms;--ease-out:cubic-bezier(.2,.8,.2,1);
}
.panel{background:#fff;border:1px solid var(--kimi-color-border);border-radius:16px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tk{font-family:var(--kimi-font-sans);color:var(--kimi-color-text-primary)}
.tk *{box-sizing:border-box}
.tk button,.tk input{font:inherit}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tt{font-size:18px;font-weight:500;letter-spacing:0}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;color:var(--kimi-color-warning);background:color-mix(in srgb,var(--kimi-color-warning) 14%,transparent)}
.sp{flex:1}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--kimi-color-text-tertiary);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--kimi-color-positive);flex:none}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--kimi-color-border);background:transparent;color:var(--kimi-color-text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:color var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out)}
.ibtn:hover{color:var(--kimi-color-text-primary);border-color:var(--kimi-color-text-tertiary)}
.ibtn svg{width:16px;height:16px}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--kimi-color-text-secondary)}
.sw input{position:absolute;opacity:0;width:0;height:0}
.trk{width:36px;height:20px;border-radius:999px;background:var(--kimi-color-surface-muted);border:1px solid var(--kimi-color-border);position:relative;transition:background var(--t-fast) var(--ease-out)}
.knb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--kimi-color-surface);border:1px solid var(--kimi-color-border);transition:transform var(--t-fast) var(--ease-out)}
.sw input:checked+.trk{background:var(--kimi-color-text-primary);border-color:var(--kimi-color-text-primary)}
.sw input:checked+.trk .knb{transform:translateX(16px);border-color:var(--kimi-color-text-primary)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--kimi-color-border);background:transparent;font-size:14px;color:var(--kimi-color-text-secondary);cursor:pointer;transition:all var(--t-fast) var(--ease-out)}
.chip:hover{color:var(--kimi-color-text-primary)}
.chip.on{background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);border-color:var(--kimi-color-text-primary)}
.grid{display:flex;gap:16px;margin-top:16px;align-items:flex-start;flex-wrap:wrap}
.tblw{flex:1 1 440px;min-width:320px}
.side{flex:0 1 280px;min-width:250px;display:flex;flex-direction:column;gap:12px}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;font-weight:400;color:var(--kimi-color-text-tertiary);padding:6px 8px;border-bottom:1px solid var(--kimi-color-border)}
.t td{padding:9px 8px;border-bottom:1px solid color-mix(in srgb,var(--kimi-color-border) 55%,transparent);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.rk{width:26px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--kimi-color-text-primary)}
.rk.top{font-size:16px}
.up{color:var(--kimi-color-positive);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.dn{color:var(--kimi-color-danger);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.fl{color:var(--kimi-color-text-quaternary);font-size:13px}
.newc{font-size:11px;padding:1px 6px;border-radius:6px;color:var(--kimi-color-warning);background:color-mix(in srgb,var(--kimi-color-warning) 15%,transparent);white-space:nowrap}
.nm{font-weight:500;font-size:14px}
.sub{font-size:12px;color:var(--kimi-color-text-tertiary);margin-top:2px;font-variant-numeric:tabular-nums}
.val{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.val span{font-size:12px;font-weight:400;color:var(--kimi-color-text-tertiary)}
.card{border:1px solid var(--kimi-color-border);border-radius:12px;padding:12px 14px}
.card h3{font-size:13px;font-weight:500;margin:0 0 4px;color:var(--kimi-color-text-secondary);display:flex;gap:6px;align-items:center}
.card h3 svg{width:14px;height:14px}
.al{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed color-mix(in srgb,var(--kimi-color-border) 60%,transparent);font-size:13px;line-height:1.5;align-items:flex-start}
.al:last-child{border-bottom:none}
.ald{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none}
.al time{color:var(--kimi-color-text-quaternary);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.rl{display:flex;gap:8px;font-size:13px;padding:5px 0;line-height:1.5}
.rl em{font-style:normal;color:var(--kimi-color-text-tertiary);flex:none}
.rl b{font-weight:400;font-variant-numeric:tabular-nums}
.ft{display:flex;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--kimi-color-text-primary);background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--kimi-color-text-primary)}
.note{font-size:12px;color:var(--kimi-color-text-quaternary);line-height:1.6}

body{margin:0;padding:24px;background:#fafafa;color:#1a1a1a}
.wrap{max-width:1080px;margin:0 auto}
.panel{background:#fff;border:1px solid #e2e2e2;border-radius:16px;padding:20px 24px}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<div class="tk">
  <div class="hdr">
    <div class="tt">TikTok 东南亚榜单监听台</div>
    <span class="badge" id="badge">连接中…</span>
    <div class="sp"></div>
    <div class="st"><span class="dot"></span>监听中&nbsp;·&nbsp;上次更新 <span id="clk">--:--:--</span></div>
    <button class="ibtn" id="rf" title="刷新榜单"><svg viewBox="0 0 24 24" fill="none"><path d="M6.88048 6.89231C9.69226 4.08054 14.251 4.08054 17.0628 6.89231L16.2364 7.71871C15.7324 8.22268 16.0894 9.0844 16.8021 9.0844H19.7276C20.1694 9.0844 20.5276 8.72623 20.5276 8.2844V5.35891C20.5276 4.64619 19.6659 4.28926 19.1619 4.79323L18.3356 5.61952C14.8209 2.1048 9.12241 2.1048 5.60769 5.61952C2.09297 9.13424 2.09297 14.8327 5.60769 18.3474C9.12241 21.8622 14.8209 21.8622 18.3356 18.3474C19.4929 17.1902 20.2703 15.7937 20.6655 14.3163C20.7939 13.8361 20.5087 13.3428 20.0285 13.2143C19.5483 13.0859 19.055 13.3711 18.9266 13.8513C18.611 15.0314 17.9906 16.1469 17.0628 17.0746C14.251 19.8864 9.69226 19.8864 6.88048 17.0746C4.06871 14.2629 4.06871 9.70409 6.88048 6.89231Z" fill="currentColor"/></svg></button>
    <label class="sw"><input type="checkbox" id="auto"><span class="trk"><span class="knb"></span></span>自动监听</label>
  </div>
  <div class="row" id="cs"></div>
  <div class="row" id="ts"></div>
  <div class="grid">
    <div class="tblw">
      <table class="t">
        <thead><tr><th style="width:26px">#</th><th style="width:52px">变动</th><th>名称</th><th style="text-align:right">核心指标</th><th style="width:64px"></th></tr></thead>
        <tbody id="bd"></tbody>
      </table>
    </div>
    <div class="side">
      <div class="card">
        <h3><svg viewBox="0 0 24 24" fill="none"><path d="M4 3.08496C4.55224 3.08496 4.99993 3.53273 5 4.08496V18.0361H19.9941L20.0967 18.041C20.6008 18.0923 20.9941 18.5185 20.9941 19.0361C20.9941 19.5538 20.6008 19.9799 20.0967 20.0312L19.9941 20.0361H5C3.89546 20.0361 3.00005 19.1407 3 18.0361V4.08496C3.00007 3.53273 3.44776 3.08496 4 3.08496ZM18.2627 6.5166C18.6316 6.10561 19.2638 6.07157 19.6748 6.44043C20.0858 6.80932 20.1198 7.44153 19.751 7.85254L15.8682 12.1787C15.1552 12.9731 13.9437 13.0678 13.1162 12.3936L10.9121 10.5967L7.45117 14.6602C7.09308 15.0805 6.46145 15.1315 6.04102 14.7734C5.6206 14.4153 5.56969 13.7837 5.92773 13.3633L9.38965 9.2998C10.0949 8.47222 11.3318 8.36 12.1748 9.04688L14.3799 10.8428L18.2627 6.5166Z" fill="currentColor"/></svg>告警动态</h3>
        <div id="feed"></div>
      </div>
      <div class="card">
        <h3><svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.0996 2C14.1963 2.00002 16.1125 2.3224 17.5371 2.87402C18.2464 3.1487 18.8793 3.49843 19.3506 3.93164C19.8228 4.36576 20.2 4.95206 20.2002 5.66895V13.9688L20.1992 13.9736L20.2002 13.9785V18.1318C20.2 18.8486 19.8228 19.4351 19.3506 19.8691C18.8793 20.3023 18.2464 20.6521 17.5371 20.9268C16.1125 21.4784 14.1963 21.8008 12.0996 21.8008C10.0032 21.8008 8.08759 21.4782 6.66309 20.9268C5.95381 20.6521 5.31994 20.3023 4.84863 19.8691C4.37651 19.4351 4.00024 18.8486 4 18.1318V5.66895C4.00015 4.95211 4.37645 4.36575 4.84863 3.93164C5.31995 3.49842 5.95375 3.14869 6.66309 2.87402C8.0876 2.32255 10.0032 2.00002 12.0996 2ZM18.3994 16.334C18.0221 16.5423 17.6065 16.7295 17.1748 16.8955C15.7376 17.357 14.0605 17.6474 12.0996 17.6475C10.1387 17.6474 8.46166 17.357 7.07324 16.9121C6.59274 16.7295 6.17711 16.5422 5.7998 16.334V18.1318C5.80001 18.1769 5.82098 18.3174 6.06738 18.5439C6.31607 18.7724 6.72644 19.0211 7.3125 19.248C8.47983 19.7 10.1647 20 12.0996 20C14.0346 20 15.7194 19.7 16.8867 19.248C17.4732 19.021 17.8841 18.7725 18.1328 18.5439C18.3791 18.3175 18.3992 18.1769 18.3994 18.1318V16.334ZM18.3994 12.1797C18.022 12.3877 17.6065 12.5742 17.1748 12.7402C15.7376 13.2027 14.0605 13.4931 12.0996 13.4932C10.1386 13.4931 8.46168 13.2027 7.07324 12.7578C6.59274 12.5742 6.17711 12.3877 5.7998 12.1797V13.9688C5.79995 13.99 5.81136 14.1397 6.14648 14.4082C6.47147 14.6685 6.9801 14.9371 7.65332 15.1973C8.85133 15.5775 10.3321 15.8369 12.0996 15.8369C13.8675 15.8369 15.3487 15.5777 16.5469 15.1973C17.2198 14.9372 17.7278 14.6684 18.0527 14.4082C18.3879 14.1397 18.3993 13.99 18.3994 13.9688V12.1797ZM18.3369 8.05859C18.2832 8.08757 18.229 8.11644 18.1738 8.14453C18.1338 8.16498 18.0934 8.18507 18.0527 8.20508C18.0069 8.22751 17.9607 8.24963 17.9141 8.27148C17.8598 8.29706 17.8053 8.32283 17.75 8.34766C17.5146 8.45061 17.3464 8.5219 17.1748 8.58789C15.7376 9.04937 14.0605 9.33983 12.0996 9.33984C10.1386 9.33982 8.46169 9.0494 7.07324 8.60449C6.55215 8.41696 6.15554 8.24768 5.7998 8.05859V9.81543L5.80273 9.84473C5.81281 9.89717 5.86573 10.0387 6.14648 10.2637C6.44536 10.5031 6.90037 10.7469 7.49512 10.9873C8.84246 11.4231 10.3269 11.6846 12.0996 11.6846C13.8675 11.6846 15.3487 11.4244 16.5469 11.0439C17.2199 10.7838 17.7279 10.5151 18.0527 10.2549C18.3054 10.0525 18.374 9.91761 18.3926 9.85449L18.3994 9.81543V8.02637C18.379 8.03763 18.3575 8.04745 18.3369 8.05859ZM12.0996 3.80078C10.1646 3.8008 8.47983 4.10077 7.3125 4.55273C6.72634 4.77972 6.31605 5.02836 6.06738 5.25684C5.82051 5.48379 5.79896 5.62415 5.79883 5.66895L5.7998 5.6709C5.7998 5.69038 5.80899 5.83993 6.14648 6.11035C6.46924 6.3689 6.97318 6.63502 7.63965 6.89355C8.84008 7.27622 10.3253 7.53807 12.0996 7.53809C13.8675 7.53807 15.3487 7.27788 16.5469 6.89746C17.2198 6.63734 17.7279 6.36863 18.0527 6.1084C18.3901 5.83802 18.3994 5.68843 18.3994 5.66895C18.3993 5.62416 18.3795 5.48371 18.1328 5.25684C17.8842 5.02826 17.4732 4.77984 16.8867 4.55273C15.7194 4.10075 14.0346 3.8008 12.0996 3.80078Z" fill="currentColor"/></svg>监听规则</h3>
        <div class="rl"><em>覆盖范围</em><b>6 国 × 5 类榜单</b></div>
        <div class="rl"><em>采集频率</em><b>每小时整点</b></div>
        <div class="rl"><em>告警阈值</em><b>新进 TOP10 / 单期升 ≥5 名 / 连续 3 期跌出</b></div>
        <div class="rl"><em>推送渠道</em><b>Webhook · 邮件 · 飞书机器人</b></div>
      </div>
    </div>
  </div>
  <div class="ft">
    <button class="btn" id="hook">健康检查</button>
    <div class="note" id="note">前端通过 /api/charts 轮询采集后端 · 告警来自 /api/alerts</div>
  </div>
</div>

<script>
(function(){
var META={videos:{label:"热门视频",fmt:function(v){return (+v).toFixed(1)+"M"},unit:"播放",sub:function(v){return "视频 · 采集值 "+(+v).toFixed(1)+"M"}},creators:{label:"创作者",fmt:function(v){return (+v).toFixed(1)+"M"},unit:"粉丝",sub:function(v){return "创作者 · 累计粉丝"}},songs:{label:"热门音乐",fmt:function(v){return Math.round(v)+"万"},unit:"使用",sub:function(v){return "音乐 · 累计使用"}},tags:{label:"话题标签",fmt:function(v){return Math.round(v)+"亿"},unit:"浏览",sub:function(v){return "话题 · 累计浏览"}},lives:{label:"带货直播",fmt:function(v){return (+v).toFixed(1)+"万"},unit:"峰值在线",sub:function(v){return "直播 · 最近一期峰值在线"}}};
var CCS=["ID","TH","VN","PH","MY","SG"],TS=["videos","creators","songs","tags","lives"];
var NAMES={ID:"印度尼西亚",TH:"泰国",VN:"越南",PH:"菲律宾",MY:"马来西亚",SG:"新加坡"};
var cur={c:"ID",t:"videos",rows:[]},timer=null;
function spark(s){if(!s||s.length<2){var v=(s&&s[0])||10,p=v*0.62;s=[];for(var i=0;i<7;i++){s.push(p);p*=1.08}}var mn=Math.min.apply(null,s),mx=Math.max.apply(null,s),rg=mx-mn||1,ly=0;var pts=s.map(function(p,i){var y=15-((p-mn)/rg)*12;if(i===s.length-1)ly=y;return (i*(60/(s.length-1))).toFixed(1)+","+y.toFixed(1)}).join(" ");return '<svg width="60" height="18" viewBox="0 0 60 18"><polyline points="'+pts+'" fill="none" stroke="var(--kimi-chart-1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="'+ly.toFixed(1)+'" r="2" fill="var(--kimi-chart-1)"/></svg>'}
function render(){var m=META[cur.t],h="";cur.rows.forEach(function(o,i){var c=o.d==="NEW"?'<span class="newc">NEW</span>':(o.d>0?'<span class="up">▲ '+o.d+'</span>':(o.d<0?'<span class="dn">▼ '+(-o.d)+'</span>':'<span class="fl">—</span>'));h+='<tr><td class="rk'+(i<3?" top":"")+'">'+(i+1)+'</td><td>'+c+'</td><td><div class="nm">'+o.n+'</div><div class="sub">'+m.sub(o.v)+'</div></td><td class="val">'+m.fmt(o.v)+' <span>'+m.unit+'</span></td><td>'+spark(o.sp)+'</td></tr>'});document.getElementById("bd").innerHTML=h||'<tr><td colspan="5" class="fl" style="padding:20px 8px">暂无数据，等待第一期采集完成（run.py 启动后会立即采集）</td></tr>'}
function setBadge(live,txt){var b=document.getElementById("badge");b.textContent=txt||live?"":"离线";b.textContent=txt||(live?"实时数据":"离线");b.style.color=live?"var(--kimi-color-positive)":"var(--kimi-color-warning)";b.style.background=live?"color-mix(in srgb,var(--kimi-color-positive) 14%,transparent)":"color-mix(in srgb,var(--kimi-color-warning) 14%,transparent)"}
function loadCharts(){var req=fetch("/api/charts?country="+cur.c+"&type="+cur.t).then(function(r){if(!r.ok)throw 0;return r.json()});req=req.catch(function(){return fetch("data/"+cur.c+"_"+cur.t+".json").then(function(r){if(!r.ok)throw 0;return r.json()})});return req.then(function(d){cur.rows=(d.entries||[]).map(function(e){return{n:e.name,v:+e.value,d:e.delta,sp:e.spark||[]}});render();setBadge(true);document.getElementById("clk").textContent=(d.captured_at||"").slice(11,19)||"--:--:--"})}
function loadAlerts(){return fetch("/api/alerts?limit=6").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return fetch("data/alerts.json").then(function(r){if(!r.ok)throw 0;return r.json()})}).then(function(d){var f=document.getElementById("feed");f.innerHTML="";(d.alerts||[]).forEach(function(a){var col=a.rule==="DROPOUT"?"danger":(a.rule==="NEW_IN_TOP10"?"warning":"positive");var div=document.createElement("div");div.className="al";div.innerHTML='<span class="ald" style="background:var(--kimi-color-'+col+')"></span><div>「'+a.name+'」在 '+a.country_name+' · '+a.type_label+'榜 '+a.detail+'</div><time>'+(a.created_at||"").slice(11,19)+'</time>';f.appendChild(div)});if(!f.children.length)f.innerHTML='<div class="al"><div class="fl">暂无告警</div></div>'})}
function refreshAll(){loadCharts().catch(function(){setBadge(false);render()});loadAlerts().catch(function(){})}
var cs=document.getElementById("cs");CCS.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===cur.c?" on":"");b.textContent=NAMES[c];b.onclick=function(){cur.c=c;[].forEach.call(cs.children,function(x){x.classList.remove("on")});b.classList.add("on");refreshAll()};cs.appendChild(b)});
var ts=document.getElementById("ts");TS.forEach(function(t){var b=document.createElement("button");b.className="chip"+(t===cur.t?" on":"");b.textContent=META[t].label;b.onclick=function(){cur.t=t;[].forEach.call(ts.children,function(x){x.classList.remove("on")});b.classList.add("on");refreshAll()};ts.appendChild(b)});
document.getElementById("rf").onclick=refreshAll;
document.getElementById("auto").onchange=function(e){if(e.target.checked){timer=setInterval(refreshAll,30000)}else{clearInterval(timer);timer=null}};
document.getElementById("hook").onclick=function(){fetch("/api/health").then(function(r){return r.json()}).then(function(d){document.getElementById("note").textContent="source="+d.source+" · 采集周期 "+d.interval_minutes+" 分钟 · 上次采集 "+(d.last_run||"无")+(d.last_error?" · 最近错误："+d.last_error.slice(0,120):"")}).catch(function(){document.getElementById("note").textContent="无法连接 /api/health，请确认 run.py 已启动"})};
refreshAll();
})();
</script>
</div></div>
</body>
</html>
